name: donora_plus
description: "Donora+ — Blood donation connection platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # phosphor_flutter 2.1.0 is incompatible with Flutter 3.43+ (IconData is a
  # final class now); phosphor_icons is the maintained fork with the same API.
  phosphor_icons: ^3.0.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.9.0

  # Navigation
  go_router: ^15.1.3

  # Maps
  flutter_map: ^8.1.0
  latlong2: ^0.9.1

  # Firebase (FCM only)
  firebase_messaging: ^15.2.6
  firebase_core: ^3.13.1

  # Media
  image_picker: ^1.1.2

  # Network
  http: ^1.4.0

  # Location
  geolocator: ^13.0.4

  # Storage
  shared_preferences: ^2.5.3

  # Utilities
  url_launcher: ^6.3.0
  intl: ^0.20.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/Donora+ Transparent.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/onboarding/
    - assets/images/logo/